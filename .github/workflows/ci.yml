name: CI — Conformidad del ecosistema ai-core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests + Validacion global (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: windows-latest
            node: '22'
          - os: macos-latest
            node: '22'
          # Node 20 removido de toda la matrix: el sandboxing de hooks propios
          # (Node.js Permission Model, --permission) requiere Node >= 22.13.0,
          # ya no existe estable en la rama 20.x. macOS ya excluia Node 20
          # desde antes por flakiness intermitente de node --test.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Regenerar settings.json (portabilidad local)
        run: node .claude/bin/setup-settings.js

      - name: Regenerar CONTEXT_MAP.json (no versionado, .gitignore linea 38)
        run: node .claude/bin/generate-map.js

      - name: Suite de tests completa (npm test — normaliza el glob entre shells)
        run: npm test

      - name: Validar conformidad de skills con CLAUDE.md
        run: node .claude/bin/validate-globals.js

  skill-evals:
    name: Evals de conformidad de skills (piloto)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # No bloqueante durante el periodo de calibracion de thresholds (Fase 2 del
    # diseno de esta sesion) -- ver .claude/evals/. Remover continue-on-error
    # solo cuando el usuario confirme que el juez LLM no produce falsos
    # positivos recurrentes tras 1-2 semanas de datos reales de PRs.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detectar si cambiaron skills o evals
        id: cambios
        uses: dorny/paths-filter@v4
        with:
          filters: |
            evals:
              - '.claude/skills/**'
              - '.claude/evals/**'

      - name: Setup Node.js 22
        if: steps.cambios.outputs.evals == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        if: steps.cambios.outputs.evals == 'true'
        run: npm install

      - name: Cache de promptfoo (evita re-pagar llamadas identicas al juez)
        if: steps.cambios.outputs.evals == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.promptfoo/cache
          key: promptfoo-${{ runner.os }}-${{ hashFiles('.claude/evals/**') }}

      - name: Correr evals de skills (piloto: security-auditor)
        if: steps.cambios.outputs.evals == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node .claude/evals/runner.js .claude/evals/security-auditor.promptfooconfig.yaml

  summary:
    name: Resumen de CI
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Estado final
        run: |
          if [ "${{ needs.test.result }}" = "success" ]; then
            echo "CI OK — todos los skills son conformes y los tests pasan en Linux/Mac/Windows."
          else
            echo "CI FALLO — revisar hallazgos en validate-globals o regresiones en harness.test.js"
            exit 1
          fi
