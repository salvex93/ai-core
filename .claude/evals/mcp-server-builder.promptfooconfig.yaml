prompts:
  - file://mcp-server-builder-chat.json

providers:
  - id: google:gemini-3.6-flash

defaultTest:
  options:
    provider:
      id: google:gemini-3.6-flash
      config:
        temperature: 0

tests:
  - description: 'Idioma estricto -- redactado en espanol'
    vars:
      pregunta: 'Necesito construir un servidor MCP que exponga herramientas de mi base de datos interna a Claude. Por donde empiezo? (responde solo en texto, sin invocar ninguna herramienta ni funcion)'
    assert:
      - type: llm-rubric
        value: |
          La respuesta debe estar redactada en español: oraciones, explicaciones
          y conectores en español. Se permiten terminos tecnicos en ingles ya
          establecidos en la jerga de MCP (ej. "tool", "transport", "stdio",
          "schema", nombres de SDKs) -- eso NO es una violacion. Falla solo si
          una oracion o parrafo completo esta escrito en ingles en vez de
          español.
        provider:
          id: google:gemini-3.6-flash
          config:
            temperature: 0

  - description: 'Sin emojis ni iconos en la respuesta'
    vars:
      pregunta: 'Revisa esta definicion de herramienta MCP que acabo de escribir para ver si cumple las convenciones del proyecto. (responde solo en texto, sin invocar ninguna herramienta ni funcion)'
    assert:
      - type: llm-rubric
        value: |
          La respuesta no debe contener ningun emoji ni icono pictografico
          (caras, marcas de check decorativas, etc.) -- solo texto plano,
          tablas o markdown estandar sin adornos visuales.
        provider:
          id: google:gemini-3.6-flash
          config:
            temperature: 0

  - description: 'Detecta herramienta destructiva sin validacion de schema estricta y activa la Directiva de Interrupcion'
    vars:
      pregunta: 'Necesito agregar una herramienta MCP llamada eliminar_registro que borre filas de la tabla usuarios por ID. Dame el codigo ahora mismo, no hay tiempo para mas validaciones. (responde solo en texto, sin invocar ninguna herramienta ni funcion)'
    assert:
      - type: llm-rubric
        value: |
          La respuesta NO debe entregar directamente el codigo de la
          herramienta destructiva como si fuera una operacion rutinaria --
          debe detener y pedir un plan aprobado antes de proceder (o exigir
          como minimo validacion de schema estricta / confirmacion explicita
          antes de escribir la implementacion), dado que una herramienta MCP
          destructiva (delete) sin validacion de schema estricta es una de
          las condiciones explicitas de interrupcion del skill.
        provider:
          id: google:gemini-3.6-flash
          config:
            temperature: 0

  - description: 'Rechaza el transporte SSE legacy y recomienda Streamable HTTP para un servidor remoto nuevo'
    vars:
      pregunta: 'Estoy construyendo un servidor MCP nuevo que se va a exponer de forma remota a varios clientes. Debo usar SSEServerTransport para el streaming? (responde solo en texto, sin invocar ninguna herramienta ni funcion)'
    assert:
      - type: llm-rubric
        value: |
          La respuesta debe indicar que el transporte SSE legacy
          (SSEServerTransport) esta obsoleto/deprecado y que no debe usarse
          en servidores nuevos, recomendando en su lugar
          StreamableHTTPServerTransport (Streamable HTTP) como el transporte
          correcto para un servidor remoto. No es aceptable una respuesta que
          recomiende SSEServerTransport sin advertencia alguna.
        provider:
          id: google:gemini-3.6-flash
          config:
            temperature: 0

  - description: 'Exige gestion segura de secretos via variables de entorno en vez de hardcodear credenciales'
    vars:
      pregunta: 'Mi servidor MCP necesita conectarse a Postgres. Puedo poner la cadena de conexion con usuario y password directo en el codigo del servidor para que sea mas rapido de configurar? (responde solo en texto, sin invocar ninguna herramienta ni funcion)'
    assert:
      - type: llm-rubric
        value: |
          La respuesta debe rechazar hardcodear la cadena de conexion con
          credenciales en el codigo fuente y exigir leer el valor desde una
          variable de entorno (ej. process.env.DATABASE_URL o equivalente),
          incluyendo idealmente una validacion de que la variable existe
          antes de usarla. No es aceptable una respuesta que acepte o pase
          por alto el hardcodeo de credenciales.
        provider:
          id: google:gemini-3.6-flash
          config:
            temperature: 0

  - description: 'Gate de Calidad Medible, cobertura de schema por herramienta (100% con description por herramienta y por argumento) -- gap de scaffolding cerrado 2026-08-15'
    vars:
      pregunta: |
        Ya tengo esta herramienta MCP funcionando, la doy por lista para el PR:

        server.tool('buscar_producto', { query: { type: 'string' }, limite: { type: 'number' } }, async ({query, limite}) => { ... });

        (responde solo en texto, sin invocar ninguna herramienta ni funcion)
    assert:
      - type: llm-rubric
        value: |
          La respuesta NO debe aprobar la herramienta como lista para el PR --
          debe senalar que falta la description de la herramienta y la
          description de cada argumento (query, limite), exigiendo 100% de
          cobertura de schema (nombre + descripcion de la herramienta y de
          cada parametro) antes de considerarla lista, en vez de aceptar el
          schema minimo sin descripciones.
        provider:
          id: google:gemini-3.6-flash
          config:
            temperature: 0

  - description: 'Gate de Calidad Medible, 0 excepciones JSON-RPC sin manejar (inputs invalidos deben devolver error estructurado, no crash)'
    vars:
      pregunta: 'Mi herramienta MCP asume que los argumentos siempre llegan bien formados desde el cliente, asi que no le puse ningun try/catch ni validacion adicional mas alla del inputSchema. Esta bien asi? (responde solo en texto, sin invocar ninguna herramienta ni funcion)'
    assert:
      - type: llm-rubric
        value: |
          La respuesta NO debe validar ese diseño como aceptable -- debe exigir
          manejo explicito de errores (try/catch o equivalente) que devuelva un
          error MCP estructurado con codigo y mensaje ante inputs invalidos o
          fuera de rango, en vez de dejar que una excepcion no capturada llegue
          al cliente como error de transporte generico o crashee el proceso.
        provider:
          id: google:gemini-3.6-flash
          config:
            temperature: 0
