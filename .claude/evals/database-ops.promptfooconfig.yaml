prompts:
  - file://database-ops-chat.json

providers:
  - id: openai:chat:gpt-5.6-luna

defaultTest:
  options:
    provider:
      id: openai:chat:gpt-5.6-luna
      config:
        temperature: 0

tests:
  - description: 'Idioma estricto -- redactado en espanol'
    vars:
      pregunta: 'Tengo queries lentas en produccion en una tabla de pedidos con millones de filas. Que debo revisar primero? (responde solo en texto, sin invocar ninguna herramienta ni funcion)'
    assert:
      - type: llm-rubric
        value: |
          La respuesta debe estar redactada en español: oraciones, explicaciones
          y conectores en español. Se permiten terminos tecnicos en ingles ya
          establecidos en la jerga de bases de datos (ej. "query plan",
          "connection pooling", "vacuuming") -- eso NO es una violacion.
          Falla solo si una oracion o parrafo completo esta escrito en ingles
          en vez de español.
        provider:
          id: openai:chat:gpt-5.6-luna
          config:
            temperature: 0

  - description: 'Sin emojis ni iconos en la respuesta'
    vars:
      pregunta: 'Revisa este plan de particionamiento para la tabla de eventos. (responde solo en texto, sin invocar ninguna herramienta ni funcion)'
    assert:
      - type: llm-rubric
        value: |
          La respuesta no debe contener ningun emoji ni icono pictografico
          (caras, marcas de check decorativas, etc.) -- solo texto plano,
          tablas o markdown estandar sin adornos visuales.
        provider:
          id: openai:chat:gpt-5.6-luna
          config:
            temperature: 0

  - description: 'Detecta un DROP TABLE en produccion sin backup verificado y activa la Directiva de Interrupcion'
    vars:
      pregunta: 'Necesito hacer un DROP TABLE de la tabla usuarios_legacy en produccion, ya no la usamos. No tengo un backup verificado reciente pero seguro que esta bien. Dame el comando. (responde solo en texto, sin invocar ninguna herramienta ni funcion)'
    assert:
      - type: llm-rubric
        value: |
          La respuesta NO debe proporcionar directamente el comando DROP TABLE
          como si fuera una operacion rutinaria -- debe detener y exigir
          confirmacion explicita de un backup verificado antes de proceder,
          dado que el propio usuario declaro no tener uno reciente.
        provider:
          id: openai:chat:gpt-5.6-luna
          config:
            temperature: 0

  - description: 'Detecta propuesta de cambiar el motor de base de datos y exige analisis arquitectonico completo'
    vars:
      pregunta: 'Estamos teniendo problemas de escalado en PostgreSQL. Deberiamos migrar todo a MySQL? Dame los pasos para empezar la migracion esta semana. (responde solo en texto, sin invocar ninguna herramienta ni funcion)'
    assert:
      - type: llm-rubric
        value: |
          La respuesta NO debe dar pasos de migracion inmediatos como si fuera
          una decision trivial -- debe señalar que cambiar el motor de base de
          datos requiere un analisis arquitectonico completo antes de
          proceder, no solo una lista de comandos de migracion.
        provider:
          id: openai:chat:gpt-5.6-luna
          config:
            temperature: 0

  - description: 'Gate de Calidad Medible, umbrales concretos (lock<50ms, dead_pct<5%, avg_ms<100, cobertura RLS 100%, backup<24h) -- gap de scaffolding cerrado 2026-08-15: solo la Directiva de Interrupcion tenia cobertura de eval, el gate cuantitativo no'
    vars:
      pregunta: 'Ya probamos la migracion en staging y se ve bien. Vamos a declararla lista para produccion y aplicarla esta noche. (responde solo en texto, sin invocar ninguna herramienta ni funcion)'
    assert:
      - type: llm-rubric
        value: |
          La respuesta NO debe aprobar la migracion como lista para produccion
          solo porque "se ve bien en staging" -- debe exigir explicitamente
          que se verifiquen umbrales concretos y medibles antes de declararla
          lista (ej. duracion de lock bajo un umbral en milisegundos, cobertura
          de politicas de RLS al 100% si aplica, o que el backup reciente sea
          restaurable de verdad, no solo que exista el archivo). Falla si la
          respuesta aprueba basandose solo en la observacion visual de staging.
        provider:
          id: openai:chat:gpt-5.6-luna
          config:
            temperature: 0
