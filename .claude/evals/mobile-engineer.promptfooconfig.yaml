prompts:
  - file://mobile-engineer-chat.json

providers:
  - id: openai:chat:gpt-5.6-luna

defaultTest:
  options:
    provider:
      id: openai:chat:gpt-5.6-luna
      config:
        temperature: 0

tests:
  - description: 'Idioma estricto -- redactado en espanol'
    vars:
      pregunta: 'Necesito armar la pantalla de login de mi app Flutter con BLoC. Que debo considerar? (responde solo en texto, sin invocar ninguna herramienta ni funcion)'
    assert:
      - type: llm-rubric
        value: |
          La respuesta debe estar redactada en español: oraciones, explicaciones
          y conectores en español. Se permiten terminos tecnicos en ingles ya
          establecidos en la jerga de desarrollo movil (ej. "widget", "BLoC",
          "state management", nombres de paquetes o frameworks) -- eso NO es
          una violacion. Falla solo si una oracion o parrafo completo esta
          escrito en ingles en vez de español.
        provider:
          id: openai:chat:gpt-5.6-luna
          config:
            temperature: 0

  - description: 'Sin emojis ni iconos en la respuesta'
    vars:
      pregunta: 'Revisa esta pantalla de Flutter que acabo de escribir para ver si cumple las convenciones del proyecto.'
    assert:
      - type: llm-rubric
        value: |
          La respuesta no debe contener ningun emoji ni icono pictografico
          (caras, marcas de check decorativas, etc.) -- solo texto plano,
          tablas o markdown estandar sin adornos visuales.
        provider:
          id: openai:chat:gpt-5.6-luna
          config:
            temperature: 0

  - description: 'Detecta sincronizacion offline-first con conflict resolution y activa la Directiva de Interrupcion'
    vars:
      pregunta: 'Necesito implementar la sincronizacion offline-first de mi app: los registros se editan localmente sin conexion y despues deben conciliarse con el backend, incluyendo casos donde el mismo registro cambio en ambos lados. Dame el codigo completo ahora mismo, es urgente.'
    assert:
      - type: llm-rubric
        value: |
          La respuesta NO debe entregar directamente el codigo completo de
          sincronizacion como si fuera una tarea rutinaria -- debe detener
          la emision de codigo e insertar la directiva de interrupcion
          (alerta arquitectonica que requiere plan aprobado), dado que
          sincronizacion offline-first con resolucion de conflictos es una
          de las condiciones explicitas de interrupcion del skill.
        provider:
          id: openai:chat:gpt-5.6-luna
          config:
            temperature: 0

  - description: 'Recomienda migrar de StateNotifierProvider (deprecado) a Notifier/AsyncNotifier en Riverpod'
    vars:
      pregunta: 'Mi proyecto Flutter usa flutter_riverpod y quiero agregar un nuevo provider para manejar el estado de la lista de partidos. Estaba pensando usar StateNotifierProvider como en un tutorial viejo que encontre, te parece bien?'
    assert:
      - type: llm-rubric
        value: |
          La respuesta debe objetar el uso de StateNotifierProvider por
          ser un patron legado/deprecado en Riverpod y recomendar usar
          Notifier o AsyncNotifier con NotifierProvider en su lugar, en
          vez de simplemente confirmar o proveer codigo con el patron
          deprecado sin objecion. No es necesario que cite el numero
          exacto de version de Riverpod en la que ocurrio la
          deprecacion.
        provider:
          id: openai:chat:gpt-5.6-luna
          config:
            temperature: 0

  - description: 'Detecta el anti-patron de mezclar state management dentro del mismo feature'
    vars:
      pregunta: 'En mi feature de autenticacion ya tengo el AuthBloc manejando el estado en la capa de presentation, pero para la capa de data quiero usar un StateNotifier de Riverpod para cachear la sesion, me parece mas comodo para ese caso puntual. Alguna objecion?'
    assert:
      - type: llm-rubric
        value: |
          La respuesta debe senalar que mezclar dos patrones de state
          management distintos (BLoC en presentation y Riverpod/StateNotifier
          en data) dentro del mismo feature viola las restricciones del
          perfil, y debe desaconsejar esa mezcla en vez de aceptarla sin
          objecion.
        provider:
          id: openai:chat:gpt-5.6-luna
          config:
            temperature: 0
