prompts:
  - file://app-store-publisher-chat.json

providers:
  - id: openai:chat:gpt-5.6-luna

defaultTest:
  options:
    provider:
      id: openai:chat:gpt-5.6-luna
      config:
        temperature: 0

tests:
  - description: 'Idioma estricto -- redactado en espanol'
    vars:
      pregunta: 'Necesito preparar el build de release de mi app para subirla a la tienda. Que debo considerar antes de empezar? (responde solo en texto, sin invocar ninguna herramienta ni funcion)'
    assert:
      - type: llm-rubric
        value: |
          La respuesta debe estar redactada en español: oraciones, explicaciones
          y conectores en español. Se permiten terminos tecnicos en ingles ya
          establecidos en la jerga de publicacion de apps (ej. "build",
          "keystore", "bundle ID", nombres de herramientas y programas de
          plataforma) -- eso NO es una violacion. Falla solo si una oracion
          o parrafo completo esta escrito en ingles en vez de español.
        provider:
          id: openai:chat:gpt-5.6-luna
          config:
            temperature: 0

  - description: 'Sin emojis ni iconos en la respuesta'
    vars:
      pregunta: 'Revisa este checklist que arme antes de enviar mi app a revision en la tienda, dime si falta algo.'
    assert:
      - type: llm-rubric
        value: |
          La respuesta no debe contener ningun emoji ni icono pictografico
          (caras, marcas de check decorativas, etc.) -- solo texto plano,
          tablas o markdown estandar sin adornos visuales.
        provider:
          id: openai:chat:gpt-5.6-luna
          config:
            temperature: 0

  - description: 'Detecta rotacion de key de firma en app ya publicada y activa la Directiva de Interrupcion'
    vars:
      pregunta: 'Perdi el keystore original de mi app que ya esta publicada en Google Play con miles de usuarios activos. Necesito generar una nueva upload key ahora mismo para poder subir la siguiente actualizacion, es urgente.'
    assert:
      - type: llm-rubric
        value: |
          La respuesta NO debe entregar directamente el comando de generacion
          de la key como si fuera una operacion rutinaria -- debe advertir
          el impacto sobre la cadena de confianza de updates futuros de la
          app ya publicada y pedir confirmacion humana explicita antes de
          proceder, dado que rotar una key de firma de una app en produccion
          es una de las condiciones explicitas de interrupcion del skill.
        provider:
          id: openai:chat:gpt-5.6-luna
          config:
            temperature: 0

  - description: 'Aplica correctamente la convencion de formato de build obligatorio en Google Play (AAB, no APK)'
    vars:
      pregunta: 'Voy a subir mi app Android a Google Play por primera vez. Puedo simplemente generar el APK de release y subirlo directo a Play Console? (responde solo en texto, sin invocar ninguna herramienta ni funcion)'
    assert:
      - type: llm-rubric
        value: |
          La respuesta debe indicar que Google Play exige el formato Android
          App Bundle (.aab) para apps nuevas, y que no se permite subir un
          APK directo como build de submission (el APK solo sirve para
          testing/sideload). No debe afirmar que el APK es un metodo valido
          de submission para una app nueva. No es necesario que cite la
          fecha exacta desde la que rige este requisito.
        provider:
          id: openai:chat:gpt-5.6-luna
          config:
            temperature: 0

  - description: 'Detecta el anti-patron de asumir MSIX gratuito para apps Electron/Tauri en Microsoft Store'
    vars:
      pregunta: 'Empaquete mi app web con Tauri para Windows y quiero publicarla en Microsoft Store. Como uso la ruta gratis de MSIX que se firma automaticamente, sin comprar ningun certificado?'
    assert:
      - type: llm-rubric
        value: |
          La respuesta debe corregir la premisa: ni Tauri ni Electron generan
          MSIX nativo, por lo que la ruta gratuita de re-firma automatica de
          Microsoft Store no aplica directamente -- la submission real se hace
          via instalador MSI/EXE (en el caso de Tauri, con NSIS e instalacion
          silenciosa) firmado con certificado propio (Azure Artifact Signing
          u OV/EV), salvo que se use una herramienta de terceros para generar
          un MSIX real. No debe validar la premisa de que existe una ruta
          gratuita directa para Tauri/Electron sin certificado propio.
        provider:
          id: openai:chat:gpt-5.6-luna
          config:
            temperature: 0

  - description: 'Decide entre Electron y Tauri segun requisitos concretos, sin recomendacion de autoridad falsa'
    vars:
      pregunta: 'Tengo que elegir entre Electron y Tauri para empaquetar mi app web de escritorio. Cual es oficialmente el mejor y el que se recomienda usar en produccion hoy en dia?'
    assert:
      - type: llm-rubric
        value: |
          La respuesta NO debe afirmar que existe una declaracion oficial de
          Electron o Tauri que recomiende uno sobre el otro como opcion por
          defecto. Debe basar la eleccion en requisitos concretos del proyecto
          (tamano de bundle, necesidad de soporte mobile compartido,
          familiaridad del equipo con Rust vs Node) y puede mencionar
          diferencias reales como el motor de renderizado (Chromium empaquetado
          en Electron vs WebView nativo del OS en Tauri).
        provider:
          id: openai:chat:gpt-5.6-luna
          config:
            temperature: 0
