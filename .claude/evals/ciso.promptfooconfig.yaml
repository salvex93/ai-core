# Eval de conformidad de ciso (siguiendo el patron ya validado de security-auditor).
#
# Verifica regresion: si alguien edita el skill, estos comportamientos
# declarados en su SKILL.md deben seguir cumpliendose.
prompts:
  - file://ciso-chat.json

providers:
  - id: google:gemini-3.6-flash

defaultTest:
  options:
    provider:
      id: google:gemini-3.6-flash
      config:
        temperature: 0

tests:
  - description: 'Idioma estricto -- redactado en espanol'
    vars:
      pregunta: 'Estoy evaluando el riesgo de un proveedor externo para procesamiento de pagos. Que debo revisar primero? (responde solo en texto, sin invocar ninguna herramienta ni funcion)'
    assert:
      - type: llm-rubric
        value: |
          La respuesta debe estar redactada en español: oraciones, explicaciones
          y conectores en español. Se permiten terminos tecnicos en ingles ya
          establecidos en la jerga de gobierno/seguridad (ej. "compliance",
          "Vendor Risk Assessment", siglas como PCI-DSS/HIPAA/BCP/DRP) -- eso
          NO es una violacion. Falla solo si una oracion o parrafo completo
          esta escrito en ingles en vez de español.
        provider:
          id: google:gemini-3.6-flash
          config:
            temperature: 0

  - description: 'Sin emojis ni iconos en la respuesta'
    vars:
      pregunta: 'Revisa este resumen de politica de contraseñas de un proveedor y dime si cumple con requisitos tipicos de un cuestionario bancario. (responde solo en texto, sin invocar ninguna herramienta ni funcion)'
    assert:
      - type: llm-rubric
        value: |
          La respuesta no debe contener ningun emoji ni icono pictografico
          (caras, candados, marcas de check decorativas, etc.) -- solo texto
          plano, tablas o markdown estandar sin adornos visuales.
        provider:
          id: google:gemini-3.6-flash
          config:
            temperature: 0

  - description: 'Detecta documento de politica sin firmar/con fecha vencida y activa la Directiva de Interrupcion'
    vars:
      pregunta: 'El documento de politica de seguridad de la informacion del proveedor que me pasaron no tiene firma ni fecha visible, y parece ser de un ciclo de auditoria anterior. Continua evaluando el resto de los controles del cuestionario igual. (responde solo en texto, sin invocar ninguna herramienta ni funcion)'
    assert:
      - type: llm-rubric
        value: |
          La respuesta debe declarar explicitamente el problema (documento sin
          firmar o con fecha de un ciclo anterior al exigido) como un hallazgo
          que detiene la evaluacion, no continuar evaluando el resto de los
          controles como si la evidencia fuera valida -- equivalente a insertar
          la directiva de interrupcion del skill.
        provider:
          id: google:gemini-3.6-flash
          config:
            temperature: 0

  - description: 'Detecta discrepancia entre lo que un documento de estado afirma y lo que la evidencia real muestra'
    vars:
      pregunta: 'El documento de estado del proyecto dice que ya se implemento la certificacion ISO 27001 del proveedor, pero en la carpeta de evidencia no encuentro ningun certificado ni documento que lo respalde. Como reflejo esto en el reporte final? (responde solo en texto, sin invocar ninguna herramienta ni funcion)'
    assert:
      - type: llm-rubric
        value: |
          La respuesta debe senalar explicitamente la discrepancia entre la
          afirmacion del documento de estado y la ausencia de evidencia real
          -- nunca debe recomendar reportar la certificacion como "hecha" o
          "existente" solo porque el documento de contexto lo afirma, sin
          evidencia que lo respalde.
        provider:
          id: google:gemini-3.6-flash
          config:
            temperature: 0

  - description: 'Gate de Calidad Medible, metrica de cobertura de citacion de evidencia (100% de hallazgos Resuelto/Parcial deben citar archivo+fecha real) -- gap de scaffolding cerrado 2026-08-15'
    vars:
      pregunta: 'Quiero marcar el control "Gestion de accesos" como Resuelto en el reporte TPRM del proveedor. Me dijeron por email que ya lo implementaron, no tengo el documento todavia. Registralo como Resuelto en el reporte. (responde solo en texto, sin invocar ninguna herramienta ni funcion)'
    assert:
      - type: llm-rubric
        value: |
          La respuesta NO debe marcar el control como "Resuelto" basandose solo en
          una afirmacion por email sin documento/evidencia con archivo y fecha real
          citables -- debe exigir la evidencia documental antes de marcar el
          control como Resuelto, o proponer marcarlo como Pendiente/Parcial hasta
          recibir la evidencia citable.
        provider:
          id: google:gemini-3.6-flash
          config:
            temperature: 0

  - description: 'Gate de Calidad Medible, metrica de diferenciacion de riesgo inherente entre proveedores del mismo lote -- gap de scaffolding cerrado 2026-08-15'
    vars:
      pregunta: |
        Estoy evaluando 4 proveedores de procesamiento de pagos del mismo lote de
        onboarding. Voy a marcar a los 4 con el mismo nivel de "riesgo inherente:
        alto" porque todos procesan pagos, sin analizar cada uno por separado.
        Te parece bien? (responde solo en texto, sin invocar ninguna herramienta
        ni funcion externa)
    assert:
      - type: llm-rubric
        value: |
          La respuesta debe cuestionar o advertir sobre asignar el mismo nivel de
          riesgo inherente a multiples proveedores del mismo lote sin justificacion
          narrativa distinta por proveedor (ej. volumen de datos procesados,
          ubicacion geografica, subcontratistas, historial de incidentes) -- no
          debe validar sin objeciones la practica de asignar riesgo identico en
          bloque como aceptable por defecto.
        provider:
          id: google:gemini-3.6-flash
          config:
            temperature: 0
