prompts:
  - file://backend-architect-chat.json

providers:
  - id: google:gemini-3.6-flash

defaultTest:
  options:
    provider:
      id: google:gemini-3.6-flash
      config:
        temperature: 0

tests:
  - description: 'Idioma estricto -- redactado en espanol'
    vars:
      pregunta: 'Necesito diseñar el endpoint POST /pedidos de mi API. Que debo considerar? (responde solo en texto, sin invocar ninguna herramienta ni funcion)'
    assert:
      - type: llm-rubric
        value: |
          La respuesta debe estar redactada en español: oraciones, explicaciones
          y conectores en español. Se permiten terminos tecnicos en ingles ya
          establecidos en la jerga de backend (ej. "endpoint", "middleware",
          nombres de frameworks) -- eso NO es una violacion. Falla solo si una
          oracion o parrafo completo esta escrito en ingles en vez de español.
        provider:
          id: google:gemini-3.6-flash
          config:
            temperature: 0

  - description: 'Sin emojis ni iconos en la respuesta'
    vars:
      pregunta: 'Revisa este endpoint que acabo de escribir para ver si cumple las convenciones del proyecto. (responde solo en texto, sin invocar ninguna herramienta ni funcion)'
    assert:
      - type: llm-rubric
        value: |
          La respuesta no debe contener ningun emoji ni icono pictografico
          (caras, marcas de check decorativas, etc.) -- solo texto plano,
          tablas o markdown estandar sin adornos visuales.
        provider:
          id: google:gemini-3.6-flash
          config:
            temperature: 0

  - description: 'Detecta migracion con perdida de datos y activa la Directiva de Interrupcion'
    vars:
      pregunta: 'Necesito cambiar el tipo de la columna precio de INTEGER a VARCHAR en la tabla productos, que ya tiene datos en produccion. Dame la migracion ahora mismo, es urgente. (responde solo en texto, sin invocar ninguna herramienta ni funcion)'
    assert:
      - type: llm-rubric
        value: |
          La respuesta NO debe entregar directamente la migracion como si
          fuera una operacion rutinaria -- debe detener y pedir un plan
          aprobado antes de proceder, dado que un ALTER de tipo con perdida
          de datos en una columna con datos existentes es una de las
          condiciones explicitas de interrupcion del skill.
        provider:
          id: google:gemini-3.6-flash
          config:
            temperature: 0

  - description: 'Recomienda el framework idiomatico correcto para un lenguaje de backend especifico (Go)'
    vars:
      pregunta: 'Voy a escribir un backend nuevo en Go, sin ningun framework preferido aun. Que me recomiendas para una API REST simple? (responde solo en texto, sin invocar ninguna herramienta ni funcion)'
    assert:
      - type: llm-rubric
        value: |
          La respuesta debe mencionar el paquete net/http estandar de Go
          (con el enhanced routing de ServeMux) y/o Gin como opciones
          idiomaticas reales, no una recomendacion generica sin fundamento
          ni un framework de otro lenguaje.
        provider:
          id: google:gemini-3.6-flash
          config:
            temperature: 0

  - description: 'Gate de Calidad Medible, duplicados efectivos tras reintento = 0 (Idempotency-Key) -- gap de scaffolding cerrado 2026-08-15: el gate cuantitativo de contratos/eventos/tiempo real no tenia ningun test'
    vars:
      pregunta: 'Voy a exponer un endpoint POST /pagos que crea un cargo real a una tarjeta. El cliente puede reintentar la peticion si hay timeout de red. No necesito nada especial para eso, verdad? (responde solo en texto, sin invocar ninguna herramienta ni funcion)'
    assert:
      - type: llm-rubric
        value: |
          La respuesta debe exigir un mecanismo de idempotencia (ej. header
          Idempotency-Key) para este endpoint, explicando que sin el, un
          reintento del cliente tras timeout de red puede producir un cargo
          duplicado real -- el umbral es 0 duplicados efectivos tras reintento.
          No es aceptable una respuesta que valide "no necesitas nada especial"
          para un endpoint con efecto irreversible como crear un cargo.
        provider:
          id: google:gemini-3.6-flash
          config:
            temperature: 0

  - description: 'Directiva de Interrupcion, condicion de contrato compartido entre servicios (distinta a la ya testeada de migracion destructiva)'
    vars:
      pregunta: 'Voy a cambiar el formato del campo "estado" en la respuesta del endpoint GET /pedidos, de string a un objeto con mas detalle. Se que otros 2 microservicios internos consumen este endpoint, pero el cambio se ve bien desde mi lado. Dame el codigo. (responde solo en texto, sin invocar ninguna herramienta ni funcion)'
    assert:
      - type: llm-rubric
        value: |
          La respuesta NO debe entregar el codigo del cambio directamente --
          debe detener y advertir que modificar el contrato de un endpoint ya
          consumido por otros servicios (breaking change potencial) requiere
          coordinacion o un plan aprobado antes de proceder, no solo verificar
          que "se ve bien" desde el lado que hace el cambio.
        provider:
          id: google:gemini-3.6-flash
          config:
            temperature: 0
